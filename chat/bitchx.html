function pickLogo() { return LOGOS[Math.floor(Math.random() * LOGOS.length)]; }

// =================== init ===================

async function init() {
  // load network selection first so all per-network storage keys resolve correctly
  migrateLegacyStorage();
  state.mode = sessionStorage.getItem('bx2:mode') === 'eliza' ? 'eliza' : 'normal';
  state.network = ls.get('network', 'efnet');
  if (!NETWORKS[state.network]) state.network = 'efnet';

  state.buffers.push(makeServerBuffer());

  state.nick = ls.get('nick', null);
  if (!state.nick) {
    state.nick = (prompt('Pick a nickname (max 9 chars, late-90s style):', 'guest' + rand(100, 999)) || ('guest' + rand(100, 999))).slice(0, 9);
    ls.set('nick', state.nick);
  }

  // Fresh start on every reload: wipe all per-channel state. Keeps nick,
  // network, and lastChannel so we can auto-rejoin where we were.
  const rememberChannel = ls.get('lastChannel', null);
  wipeChannelStorage();

  redrawBuffer();

  // banner / MOTD always rendered on the server buffer at index 0
  state.buffers[0].transcript = [];
  persistBuffer(state.buffers[0]);
  if (state.currentIdx === 0) $sb.innerHTML = '';
  const logo = pickLogo();
  for (const lineHtml of logo) emit(state.buffers[0], { kind: 'logo', html: lineHtml });
  // Full server connection sequence: hostname/ident lookup, RFC numerics
  // 001-005 (welcome, host, created, MYINFO, ISUPPORT), 251-266 (user/oper
  // /channel stats), then the per-network MOTD body bracketed by
  // MOTDSTART / ENDOFMOTD. ELIZA fallback keeps its custom MOTD instead.
  if (state.mode === 'eliza') {
    // ELIZA fallback: a synthesised MIT AI Lab 1966 connection sequence,
    // followed by the fallback MOTD that explains why this mode is active.
    const elizaHandshake = [
      '*** Looking up your hostname...',
      '*** Found your hostname',
      `*** Welcome to the M.I.T. AI Lab Time-Sharing System ${state.nick}!${fakeHost(state.nick)}`,
      '*** Your host is M.I.T. AI Lab, running DOCTOR.SCRIPT 1.0',
      '*** This server was created Sat Jan  1 09:30:00 1966',
      '*** M.I.T. PDP-6 DOCTOR.SCRIPT-1.0 i ntr',
      '*** NETWORK=ELIZA NICKLEN=8 CHANTYPES=# CASEMAPPING=ascii :are supported by this server',
      '*** There is 1 user and 0 invisible on 1 server',
      '*** 1 :IRC Operators online (ELIZA)',
      '*** 0 :unknown connection(s)',
      '*** 1 :channels formed',
      '*** I have 1 clients and 1 servers',
      '*** Current local users: 1  Max: 1',
      '*** Current global users: 1  Max: 1',
      '*** - M.I.T. AI Lab Message of the Day -'
    ];
    for (const line of elizaHandshake) {
      emit(state.buffers[0], { ts: hhmm24(), kind: 'motd', text: line });
    }
    for (const line of ELIZA_MOTD) {
      emit(state.buffers[0], { ts: hhmm24(), kind: 'motd', text: line });
    }
    emit(state.buffers[0], { ts: hhmm24(), kind: 'motd', text: '*** End of /MOTD command.' });
  } else {
    const handshake = serverHandshake(currentNet(), state.nick);
    for (const line of handshake) {
      emit(state.buffers[0], { ts: hhmm24(), kind: 'motd', text: line });
    }
    for (const line of currentNet().motd) {
      emit(state.buffers[0], { ts: hhmm24(), kind: 'motd', text: line });
    }
    for (const line of serverEndOfMotd()) {
      emit(state.buffers[0], { ts: hhmm24(), kind: 'motd', text: line });
    }
  }
  emit(state.buffers[0], { ts: hhmm24(), kind: 'info', text: `*** Your nickname is ${state.nick}` });
  emit(state.buffers[0], { ts: hhmm24(), kind: 'info', text: `*** Mode change "+i" for user ${state.nick} by ${state.nick}` });
  emit(state.buffers[0], { ts: hhmm24(), kind: 'info', text: `connected to ${currentNet().name}. type /help for commands, /list for channels, /server to switch networks, /music on for sinny - sky sunday.` });

  try { await ensureLLM(); console.info('on-device model ready'); }
  catch (err) { console.warn('on-device model init failed:', err.message); }

  resetIdleTimer();
  scheduleBackgroundEvent();
  $inp.focus();

  // Auto-join the most recent channel (or #2600 default). In ELIZA fallback
  // mode we always land in #love alongside her, regardless of any saved
  // lastChannel from before fallback was enabled.
  const autoTarget = state.mode === 'eliza' ? '#love' : (rememberChannel || '#2600');
  try {
    if (state.mode === 'eliza') {
      // ELIZA mode: drop the user straight into #love with her.
      await joinChannel(autoTarget);
    } else {
      // Regular IRC: create the channel buffer silently in the background so
      // the welcome / stats / MOTD on the server buffer stay on-screen and
      // do not get briefly clobbered by 'Joining #chan...' flickering past.
      await joinChannel(autoTarget, { switchTo: false });
      const serverBufferIdx = state.buffers.findIndex(b => b.type !== 'channel');
      if (serverBufferIdx >= 0) {
        const hint = `*** auto-joined ${autoTarget} (press Alt+2 or /window 2 to enter)`;
        emit(state.buffers[serverBufferIdx], { ts: hhmm24(), kind: 'info', text: hint });
      }
    }
  }
  catch (err) { sysToCurrent(`auto-join ${autoTarget} failed: ${err.message}`, 'err'); }
}

let _switchingNetwork = false;
window.addEventListener('beforeunload', () => { if (!_switchingNetwork) persistAll(); });


// =================== focus management ===================
// The input prompt should always reclaim focus unless the user is actively
// selecting text in the scrollback.
document.addEventListener('mouseup', () => {
  const sel = window.getSelection();
  if (!sel || sel.toString().length === 0) {
    setTimeout(() => $inp.focus(), 0);
  }
});
document.addEventListener('keydown', (e) => {
  if (document.activeElement === $inp) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // any printable key or Backspace returns focus to the input
  if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Enter') {
    $inp.focus();
  }
});
window.addEventListener('focus', () => $inp.focus());

// =================== preflight: Chrome + LanguageModel availability ===================

async function checkRequirements() {
  const ua = navigator.userAgent;
  const m = ua.match(/Chrome\/(\d+)/);
  const chromeVer = m ? parseInt(m[1]) : 0;
  // exclude Firefox (which doesn't have Chrome/ in UA anyway), and explicitly
  // exclude Edge / Opera which are Chromium-based but don't ship the Prompt API
  // origin trial token machinery in the same way.
  const isChromium = chromeVer > 0;
  const isPureChrome = isChromium && !/Edg\/|OPR\//.test(ua);
  const isMobile = /Mobile|Android|iPhone|iPad|iPod/i.test(ua);
  const isDesktop = !isMobile;
  const hasLMAPI = typeof LanguageModel !== 'undefined';
  let lmAvailable = null;
  if (hasLMAPI) {
    try {
      lmAvailable = await LanguageModel.availability({ expectedInputs: [{ type: 'text' }] });
    } catch (e) {
      lmAvailable = 'error: ' + (e.message || e);
    }
  }
  const lmReady = lmAvailable === 'available' || lmAvailable === 'downloadable' || lmAvailable === 'after-download';
  return {
    ua, chromeVer, isChromium, isPureChrome, isDesktop, isMobile,
    hasLMAPI, lmAvailable, lmReady,
    allOK: isChromium && chromeVer >= 128 && isDesktop && hasLMAPI && lmReady
  };
}

function renderRequirementsScreen(check) {
  $sb.innerHTML = '';
  const mark = (cond) => cond ? '<span class="ok">[X]</span>' : '<span class="err">[ ]</span>';
  const lines = [
    '',
    '<span class="ev-key">============================================================</span>',
    '<span class="ev-key">       BitchX-1.1-final pre-flight requirements</span>',
    '<span class="ev-key">============================================================</span>',
    '',
    `  ${mark(check.isChromium)} Chrome / Chromium browser <span class="dim">(detected: ${check.isChromium ? 'yes, build ' + check.chromeVer : 'no'})</span>`,
    `  ${mark(check.chromeVer >= 128)} Chrome 128 or newer <span class="dim">(you have: ${check.chromeVer || 'unknown'})</span>`,
    `  ${mark(check.isDesktop)} Desktop platform <span class="dim">(detected: ${check.isDesktop ? 'desktop' : 'mobile - the Prompt API does not ship on Android Chrome yet'})</span>`,
    `  ${mark(check.hasLMAPI)} window.LanguageModel API present <span class="dim">(the Prompt API)</span>`,
    `  ${mark(check.lmReady)} On-device Gemini Nano model ready <span class="dim">(status: ${check.lmAvailable || 'n/a'})</span>`,
    '',
    '<span class="ev-key">------------------------------------------------------------</span>',
    '<span class="ev-key">How to enable the Prompt API:</span>',
    '',
    '  1. Use Chrome 128 or newer on a desktop platform.',
    '  2. Open <span class="ev-arg">chrome://flags</span>',
    '  3. Enable <span class="ev-val">"Prompt API for Gemini Nano"</span>',
    '  4. Enable <span class="ev-val">"Prompt API for Gemini Nano with Multimodal Input"</span>',
    '  5. Restart Chrome.',
    '  6. Open <span class="ev-arg">chrome://components</span>',
    '  7. Find <span class="ev-val">"Optimization Guide On Device Model"</span> and click "Check for update".',
    '  8. Wait for the ~3GB model to download.',
    '  9. Refresh this page.',
    '',
    'If you do not have an origin-trial token for this domain, the API may also',
    'be gated. Origin trials: https://developer.chrome.com/origintrials',
    '',
    '<span class="ev-key">------------------------------------------------------------</span>',
    `  <span class="dim">UA: ${esc(check.ua)}</span>`,
    '',
    '  <span class="ok" id="eliza-mode" style="cursor:pointer; text-decoration:underline; font-weight:bold;">[ Continue to #love with ELIZA - works on mobile, no Prompt API needed ]</span>',
    '',
    '  <span class="dim" id="try-anyway" style="cursor:pointer; text-decoration:underline;">[ or: open the regular UI with fallback personas (no LLM responses) ]</span>',
    ''
  ];
  for (const line of lines) {
    appendLine(line);
  }
  const btn = document.getElementById('try-anyway');
  if (btn) {
    btn.addEventListener('click', () => {
      sessionStorage.removeItem('bx2:mode');
      sessionStorage.setItem('bx2:skip_preflight', '1');
      location.reload();
    });
  }
  const elizaBtn = document.getElementById('eliza-mode');
  if (elizaBtn) {
    elizaBtn.addEventListener('click', () => {
      sessionStorage.setItem('bx2:mode', 'eliza');
      sessionStorage.setItem('bx2:skip_preflight', '1');
      location.reload();
    });
  }
}

async function bootstrap() {
  const skip = sessionStorage.getItem('bx2:skip_preflight') === '1';
  if (!skip) {
    try {
      const check = await checkRequirements();
      if (!check.allOK) {
        renderRequirementsScreen(check);
        return;
      }
    } catch (err) {
      // checkRequirements itself blew up. Render anyway with an error marker.
      renderRequirementsScreen({ ua: navigator.userAgent, chromeVer: 0, isChromium: false, isDesktop: false, hasLMAPI: false, lmAvailable: 'error: ' + err.message, lmReady: false, allOK: false });
      return;
    }
  }
  await init();
}

bootstrap().catch(err => {
  console.error(err);
  appendLine(`<span class="err">fatal: ${esc(err.message || err)}</span>`);
});

})();
</script>
