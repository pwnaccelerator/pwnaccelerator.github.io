<style>
  /* mIRC palette */
  :root {
    --c0:  #ffffff; --c1:  #000000; --c2:  #00007f; --c3:  #009300;
    --c4:  #ff0000; --c5:  #7f0000; --c6:  #9c009c; --c7:  #fc7f00;
    --c8:  #ffff00; --c9:  #00fc00; --c10: #009393; --c11: #00ffff;
    --c12: #0000fc; --c13: #ff00ff; --c14: #7f7f7f; --c15: #d2d2d2;

    --bg: #000;
    --fg: #d2d2d2;
    --statusbg: #00007f;
    --statusfg: #00ffff;
    --statusalt: #ffff00;
    --statusw:   #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    /* X11 root window: dim grey with a fine stipple */
    background-color: #353535;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.03) 75%),
      linear-gradient(45deg, rgba(255,255,255,0.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.03) 75%);
    background-size: 4px 4px;
    background-position: 0 0, 2px 2px;
    color: var(--fg);
    font: 13px/1.3 ui-monospace, "DejaVu Sans Mono", "Iosevka Term", "Menlo", "Consolas", monospace;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  /* Motif / CDE-style xterm window chrome.
     Chunky 3D bevel in beige-grey, outer hairline. */
  #window {
    /* mid-90s xterm running BitchX: roughly 80 cols x 25 rows of monospace
       plus the Motif window chrome. ~880x680 caps the window at the
       proportions of a 14" CRT at 1024x768 in 4:3 aspect. */
    width: min(96vw, 880px);
    height: min(96vh, 680px);
    aspect-ratio: 880 / 680;
    background: #b8b4ac;            /* Motif beige-grey */
    border: 2px solid;
    border-top-color: #e8e6df;
    border-left-color: #e8e6df;
    border-right-color: #2a2825;
    border-bottom-color: #2a2825;
    outline: 1px solid #000;
    padding: 3px;
    display: flex;
    flex-direction: column;
  }
  /* Motif active title bar: solid blue, white text, no gradient */
  #titlebar {
    background: #3a587c;
    color: #ffffff;
    padding: 1px 3px;
    font: bold 11px "Helvetica", "Verdana", "DejaVu Sans", sans-serif;
    display: flex;
    align-items: center;
    gap: 3px;
    user-select: none;
    flex: 0 0 auto;
    height: 22px;
    border: 1px solid;
    border-top-color: #6b88a8;
    border-left-color: #6b88a8;
    border-right-color: #1a2c44;
    border-bottom-color: #1a2c44;
  }
  #title-icon {
    color: #ffffff;
    margin-right: 2px;
    font-weight: bold;
    font-family: inherit;
  }
  #title-text {
    flex: 1;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .tb-controls { display: flex; gap: 1px; }
  /* Motif-style square buttons, thin bevel */
  .tb-btn {
    background: #b8b4ac;
    color: #000;
    border: 1px solid;
    border-top-color: #e8e6df;
    border-left-color: #e8e6df;
    border-right-color: #2a2825;
    border-bottom-color: #2a2825;
    width: 18px;
    height: 18px;
    font: 11px/1 "Helvetica", "Verdana", "DejaVu Sans", sans-serif;
    padding: 0;
    cursor: default;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tb-btn:active {
    border-top-color: #2a2825;
    border-left-color: #2a2825;
    border-right-color: #e8e6df;
    border-bottom-color: #e8e6df;
  }

  /* The xterm terminal area, inset into the Motif frame */
  #app {
    background: var(--bg);
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-height: 0;
    margin-top: 2px;
    border: 1px solid;
    border-top-color: #2a2825;
    border-left-color: #2a2825;
    border-right-color: #e8e6df;
    border-bottom-color: #e8e6df;
  }

  /* small screens: drop the chrome, full bleed */
  @media (max-width: 768px), (max-height: 540px) {
    body { padding: 0; background: var(--bg); background-image: none; }
    #window {
      width: 100%;
      height: 100vh;
      border: none;
      outline: none;
      padding: 0;
    }
    #titlebar { display: none; }
    #app { border: none; margin-top: 0; }

  .statusbar {
    background: var(--statusbg);
    color: var(--statusfg);
    padding: 0 4px;
    white-space: pre;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 13px;
    line-height: 1.4;
    flex: 0 0 auto;

  .statusbar .dim { color: var(--c14); }

    overflow-y: auto;
    padding: 2px 6px;
    white-space: pre-wrap;

  .ev-val { color: var(--c8); }                        /* topic text, mode params */
  .ev-by  { color: var(--c11); }                       /* "by nick" */
  .ev-nick { color: var(--c15); font-weight: bold; }

  .part-arrow { color: var(--c4); font-weight: bold; }
  .quit-arrow { color: var(--c4); font-weight: bold; }
  .join-host { color: var(--c14); }
  .join-nick { color: var(--c15); font-weight: bold; }

  .me        { color: var(--c13); }
  .err       { color: var(--c4); }
  .ok        { color: var(--c3); }
  .info      { color: var(--c11); }
  .motd      { color: var(--c14); }
  .banner    { color: var(--c8); }
  .banner2   { color: var(--c3); }
  .banner3   { color: var(--c11); }

  .line.logo { white-space: pre; line-height: 1.0; padding: 0; font-size: 12px; overflow-x: hidden; }
  .line.logo i { font-style: normal; }

  .br        { color: var(--c15); }  /* < > brackets around nicks */

  /* names list grid cell */
  .ncell     { color: var(--c15); }
  .ncell .op  { color: var(--c8); font-weight: bold; }     /* @ */
  .ncell .vc  { color: var(--c11); font-weight: bold; }    /* + */
  .ncell .br2 { color: var(--c11); }                        /* [ ] */

  #inputline {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    background: var(--bg);
    padding: 1px 6px 3px;
    gap: 4px;
  }
  #prompt { color: var(--c11); white-space: nowrap; }
  #prompt .b { color: var(--c11); }
  #prompt .n { color: var(--c15); }
  #input {
    flex: 1;
    background: transparent;
    color: var(--fg);
    border: none;
    outline: none;
    font: inherit;
    padding: 0;
    caret-color: var(--c15);
  }

  .nc2  { color: var(--c2);  } .nc3  { color: var(--c3);  }
  .nc4  { color: var(--c4);  } .nc5  { color: var(--c5);  }
  .nc6  { color: var(--c6);  } .nc7  { color: var(--c7);  }
  .nc8  { color: var(--c8);  } .nc9  { color: var(--c9);  }
  .nc10 { color: var(--c10); } .nc11 { color: var(--c11); }
  .nc12 { color: var(--c12); } .nc13 { color: var(--c13); }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
</style>

// Response-frequency rate limiting. The naive "ask every active persona on
// every user message" is way too chatty. These two knobs cap it.
// - MAX_BACKGROUND_RESPONDERS: at most this many non-mentioned personas get
//   the "respond or SKIP" prompt per user message. Mentioned personas always
//   get prompted regardless of this cap.
// - BACKGROUND_PROBABILITY: each candidate persona is rolled against this
//   before being prompted, so even within the cap many turns pass quietly.
// - COOLDOWN_MS: a persona who spoke this recently is skipped entirely.
const MAX_BACKGROUND_RESPONDERS = 1;
const BACKGROUND_PROBABILITY = 0.22;
const COOLDOWN_MS = 25_000;

// =================== ELIZA fallback (Weizenbaum 1966) ===================
// Pure pattern-matching chatbot used when the Prompt API isn't available
// (Firefox, Safari, mobile, missing origin trial token, ...). The user is
// alone with ELIZA in #love. No LLM calls, no network, just a faithful
// reimplementation of the canonical DOCTOR script.

const ELIZA_REFLECTIONS = {
  'am': 'are', 'was': 'were', 'i': 'you', "i'd": 'you would',
  "i've": 'you have', "i'll": 'you will', 'my': 'your', 'are': 'am',
  "you've": 'I have', "you'll": 'I will', 'your': 'my', 'yours': 'mine',
  'you': 'me', 'me': 'you', 'myself': 'yourself', 'yourself': 'myself'
};

const ELIZA_PSYCHOBABBLE = [
  [/\bI need (.*)/i, [
    "Why do you need %1?",
    "Would it really help you to get %1?",
    "Are you sure you need %1?"
  ]],
  [/\bWhy don'?t you ([^?]*)\??/i, [
    "Do you really think I don't %1?",
    "Perhaps eventually I will %1.",
    "Do you really want me to %1?"
  ]],
  [/\bWhy can'?t I ([^?]*)\??/i, [
    "Do you think you should be able to %1?",
    "If you could %1, what would you do?",
    "I don't know -- why can't you %1?",

function elizaReflect(text) {
  // Swap first-person ↔ second-person pronouns word by word.
  return text.split(/\b/).map(w => {
    const k = w.toLowerCase();
    return Object.prototype.hasOwnProperty.call(ELIZA_REFLECTIONS, k)
      ? ELIZA_REFLECTIONS[k]
      : w;
  }).join('');
}

function elizaRespond(input) {
  const text = String(input || '').trim();
  for (const [pattern, responses] of ELIZA_PSYCHOBABBLE) {
    const m = text.match(pattern);
    if (!m) continue;
    let resp = responses[Math.floor(Math.random() * responses.length)];
    for (let i = 1; i < m.length; i++) {
      const cap = (m[i] || '').trim().replace(/[.!?]+$/, '');
      const reflected = elizaReflect(cap);
      resp = resp.replace(new RegExp('%' + i, 'g'), reflected);
    }
    return resp;
  }
  return "I'm not sure I understand you fully.";
}

  const extras = shuffleInPlace(netChans.filter(c => c !== currentChan))

    return c;
  }).join(' ');

function persistBuffer(b) {
  if (b.type !== 'channel') return;
  nls.set(`transcript:${b.name}`, b.transcript);
  nls.set(`personas:${b.name}`, b.personas);
  nls.set(`active:${b.name}`, [...b.active]);
  nls.set(`lurkers:${b.name}`, b.lurkers);
}
function persistAll() {
  ls.set('nick', state.nick);
  ls.set('network', state.network);
  nls.set('channels', state.buffers.filter(b => b.type === 'channel').map(b => b.name));
  nls.set('current', currentBuffer()?.name || null);
  for (const b of state.buffers) persistBuffer(b);

// Wipe all per-channel state from localStorage. Keeps only global keys
// (nick, network, lastChannel) so the user does not have to re-enter their
// nick and the server selection persists.
function wipeChannelStorage() {
  const KEEP = new Set(['nick', 'network', 'lastChannel']);
  const toRemove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith('bx2:')) continue;
    const tail = k.slice(4);
    if (KEEP.has(tail)) continue;
    toRemove.push(k);
  }
  for (const k of toRemove) localStorage.removeItem(k);
}

// One-time migration: pre-multi-network state was stored as bx2:<key>
// without a network segment. Move it under bx2:efnet:<key>.
function migrateLegacyStorage() {
  // marker keys that indicate legacy layout
  const legacyChannels = localStorage.getItem('bx2:channels');
  if (!legacyChannels) return;
  const KNOWN_PREFIXES = ['efnet:', 'ircnet:', 'undernet:'];
  const toMove = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith('bx2:')) continue;
    const tail = k.slice(4);
    if (tail === 'nick' || tail === 'network') continue;
    if (KNOWN_PREFIXES.some(p => tail.startsWith(p))) continue;
    toMove.push([k, `bx2:efnet:${tail}`]);
  }
  for (const [oldK, newK] of toMove) {
    const v = localStorage.getItem(oldK);
    if (v != null) localStorage.setItem(newK, v);
    localStorage.removeItem(oldK);
  }
}

function rand(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function currentBuffer() { return state.buffers[state.currentIdx]; }
function bufferByName(name) { return state.buffers.find(b => b.name.toLowerCase() === name.toLowerCase()); }
function bufferIndex(name) { return state.buffers.findIndex(b => b.name.toLowerCase() === name.toLowerCase()); }
function fakeHost(nick) {
  // Returns the "ident@host" part. The render template wraps it in parens.
  // 1998-era hostmasks: heavy dialup, raw IPs, university lab, european ISPs,
  // occasional corporate proxy. Patterns picked to look authentic to anyone
  // who lurked on EFnet in '98.
  const a = () => rand(1, 254);
  const user = nick.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0, 8) || 'user';
  // ~ prefix when the ident protocol failed (very common for dialup clients)
  const ident = Math.random() < 0.35 ? '~' + user : user;
  const host = chooseHost(a);
  return `${ident}@${host}`;
}

function chooseHost(a) {
  const r = Math.random();
  if (r < 0.20) {
    // raw IP - what shows when reverse DNS doesn't resolve
    return `${a()}.${a()}.${a()}.${a()}`;
  } else if (r < 0.55) {
    // dialup ISP, the bread and butter of 1998 IRC
    return pick([
      `dialup-${a()}-${a()}-${a()}-${a()}.dyn.earthlink.net`,
      `pool-${a()}-${a()}.${pick(['nyc','atl','chi','la','bos','sea','dc','phx'])}.east.verizon.net`,
      `${a()}-${a()}-${a()}-${a()}.dialup.netcom.com`,
      `ACA${a()}${a()}${a()}.ipt.aol.com`,
      `cache-${a()}.proxy.aol.com`,
      `mfp-${a()}${a()}.dialup.mindspring.com`,
      `host-${a()}-${a()}.mindspring.com`,
      `dialup-${a()}-${a()}-${a()}.dialup.ibm.net`,
      `${a()}-${a()}-${a()}-${a()}.dialup.erols.com`,
      `dialup-${a()}-${a()}.dialup.psi.net`,
      `ppp-${a()}-${a()}-${a()}.dialup.uu.net`,
      `dialup-${a()}.${pick(['atlanta','dallas','denver','seattle'])}.compuserve.com`,
      `sprint-${a()}-${a()}.dialup.sprintmail.com`,
      `prodigy-${a()}${a()}.dialsprint.net`
    ]);
  } else if (r < 0.70) {
    // cable / isdn / dsl - "broadband" was barely a thing in '98
    return pick([
      `cable-${a()}-${a()}-${a()}-${a()}.${pick(['atl','sea','sf','bos'])}.home.com`,
      `isdn-${a()}-${a()}.bellsouth.net`,
      `dsl-${a()}-${a()}-${a()}.${pick(['sf','la','sj','sd'])}.pacbell.net`,
      `pool-${a()}-${a()}.${pick(['nyc','bos','phl'])}.adelphia.net`,
      `cox-${a()}-${a()}-${a()}.cox.net`
    ]);
  } else if (r < 0.84) {
    // university lab / dorm
    return pick([
      `dialup-${a()}.lns.mit.edu`,
      `gs${a()}${a()}.sp.cs.cmu.edu`,
      `dialup-${a()}-${a()}.its.berkeley.edu`,
      `pikachu.caltech.edu`,
      `lab-${a()}.${pick(['cs','ee','math','phys'])}.${pick(['mit','cmu','berkeley','stanford','utexas','umich','cornell','gatech','uiuc'])}.edu`,
      `student-${a()}${a()}.lab.brown.edu`,
      `dorm-${a()}-${a()}.res.${pick(['mit','rpi','wpi','duke'])}.edu`,
      `unix${a()}.cc.${pick(['umich','wisc','illinois','virginia'])}.edu`
    ]);
  } else if (r < 0.96) {
    // european dialup
    return pick([
      `host-${a()}-${a()}.dialup.demon.co.uk`,
      `${a()}-${a()}.dialup.tin.it`,
      `dialup-${a()}-${a()}.t-online.de`,
      `pikku-${a()}.dialup.funet.fi`,
      `${a()}-${a()}.dialup.xs4all.nl`,
      `dial-${a()}-${a()}.swip.net`,
      `${a()}-${a()}-${a()}-${a()}.dialup.wanadoo.fr`,
      `host-${a()}-${a()}.rwth-aachen.de`,
      `ppp-${a()}.dial.btinternet.com`,
      `host-${a()}.dialup.pipex.com`,
      `dialup-${a()}.tele2.se`,
      `${a()}.${a()}.cust.coditel.net`
    ]);
  } else {
    // corporate / exotic - rare on EFnet but happens
    return pick([
      `proxy.cisco.com`,
      `gateway.${pick(['ibm','sun','sgi','dec','novell','3com'])}.com`,
      `firewall.${pick(['microsoft','apple','adobe','sybase'])}.com`,
      `mail.cypherpunks.to`,
      `panix.com`,
      `well.com`,
      `gw.cern.ch`,
      `irc-bouncer.lopht.com`
    ]);
  }
}

function renderStatus() {
  const b = currentBuffer();
  const time = hhmmAMPM();
  const nickBuf = `${state.nick || '*'}[${(state.currentIdx + 1)}]`;
  const umodes = '( iw)';
  const mail = 'Mail: 0';
  let chanPart;
  if (!b || b.type !== 'channel') {
    chanPart = `<span class="dim">[server]</span>`;
  } else {
    const ops = (b.personas?.length) || 0;
    const lurk = (b.lurkers?.length) || 0;
    chanPart = `<span class="w">${esc(b.name)}</span>(<span class="alt">+nt</span> ${ops})`;
    const pending = state.pendingResponses;
    if (pending) chanPart += ` <span class="alt">[${pending} pending]</span>`;

  $bot.innerHTML =
    `<span class="alt">${time}</span> ` +
    `<span class="w">${esc(nickBuf)}</span> ` +
    `${umodes} ` +
    `${mail} ` +
    chanPart +
    `   <span class="dim">[U:r,S:b/h]</span>`;

  const O = state.buffers.filter(x => x.type === 'channel').length;
  const N = (b && b.type === 'channel')
    ? (((b.lurkers?.length) || 0) + ((b.personas?.length) || 0) + 1)
    : 0;
  const I = state.pendingResponses;
  const V = 0;
  const F = state.modelReady ? 0 : 1;
  $lag.innerHTML =
    `<span class="alt">Lag</span> 0   ` +
    `<span class="alt">O</span> ${O}   ` +
    `<span class="alt">N</span> ${N}   ` +
    `<span class="alt">I</span> ${I}   ` +
    `<span class="alt">V</span> ${V}   ` +
    `<span class="alt">F</span> ${F}   ` +
    `<span class="dim">${esc(currentNet().name)}</span>   ` +

  $prm.innerHTML =
    `<span class="b">[</span><span class="n">${esc(b ? b.name : '*')}</span><span class="b">]</span>`;

  // window title bar: "BitchX-1.1-final - nick @ Network [music: title]"

      ? ` - \u266B ${music.title || 'sky sunday'}`

  }
}

function appendLine(html) {

  div.innerHTML = html;

  $sb.appendChild(div);
  if (atBottom) $sb.scrollTop = $sb.scrollHeight;

function px() { return `<span class="px">«º»</span>`; }
function tsSpan(ts) { return `<span class="ts">${esc(ts)}</span>`; }

function fmtChatNick(nick) {

}

function renderEntry(e) {
  const ts = tsSpan(e.ts);
  switch (e.kind) {
    case 'msg': {

        `<span class="${cls}">${ts} <span class="br">&lt;</span>${fmtChatNick(e.nick)}<span class="br">&gt;</span> ${esc(e.text)}</span>`
      );
      break;
    }
    case 'me':
      appendLine(`${ts} ${px()} <span class="me">${esc(e.nick)} ${esc(e.text)}</span>`);
      break;
    case 'join':
      appendLine(
        `${ts} ${px()} <span class="join-nick">${esc(e.nick)}</span> ` +
        `<span class="join-host">(${esc(e.host || fakeHost(e.nick))})</span> ` +
        `has joined <span class="ev-arg">${esc(e.chan)}</span>`

      break;
    case 'part':
      appendLine(
        `${ts} ${px()} <span class="join-nick">${esc(e.nick)}</span> ` +

        `has left <span class="ev-arg">${esc(e.chan)}</span>` +

    case 'quit':
      appendLine(
        `${ts} ${px()} <span class="join-nick">${esc(e.nick)}</span> ` +

function emit(buffer, entry) {
  buffer.transcript.push(entry);
  if (buffer.transcript.length > MAX_TRANSCRIPT) {
    buffer.transcript.splice(0, buffer.transcript.length - MAX_TRANSCRIPT);
  }
  // Track last-spoke timestamps for cooldown logic. Map is ephemeral
  // (per-session, not persisted), which is fine: cooldown only matters
  // for activity bursts within the same session.
  if ((entry.kind === 'msg' || entry.kind === 'me') && entry.nick) {
    if (!buffer.lastSpoke) buffer.lastSpoke = new Map();
    buffer.lastSpoke.set(entry.nick, Date.now());
  }
  persistBuffer(buffer);
  if (buffer === currentBuffer()) renderEntry(entry);
}

function recentlySpoke(buffer, nick, withinMs = COOLDOWN_MS) {
  const m = buffer.lastSpoke;
  if (!m) return false;
  const t = m.get(nick);
  return t && (Date.now() - t < withinMs);
}

function shuffleInPlace(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function redrawBuffer() {
  $sb.innerHTML = '';
  const b = currentBuffer();
  if (!b) return;
  for (const e of b.transcript) renderEntry(e);
  $sb.scrollTop = $sb.scrollHeight;
  renderStatus();
}

function sysToCurrent(text, kind='sys') {
  const b = currentBuffer();
  if (!b) return;
  emit(b, { ts: hhmm24(), kind, text });
}

// =================== names grid (canonical BitchX) ===================

const NAME_CELL_W = 14;       // chars inside [ ... ]
const NAME_COLS = 5;

function fmtNameCell(nick, prefix='') {
  // prefix is '@', '+', or '' (which renders as a leading space inside brackets)
  const lead = prefix || ' ';
  const inner = lead + nick;
  const padded = inner.padEnd(NAME_CELL_W + 1).slice(0, NAME_CELL_W + 1);
  // colorize: brackets cyan, prefix yellow (@) or cyan (+), nick neutral
  const prefSpan = prefix === '@'
    ? `<span class="op">@</span>`
    : prefix === '+'
      ? `<span class="vc">+</span>`
      : ` `;
  // pad remainder for column alignment after the prefix consumed 1 char
  const rest = nick + ' '.repeat(Math.max(0, NAME_CELL_W - 1 - nick.length));
  return `<span class="ncell"><span class="br2">[</span>${prefSpan}${esc(rest)}<span class="br2">]</span></span>`;
}

function buildNamesGrid(buffer) {
  // ops first, then voiced, then plain
  const me = state.nick;
  const ops = buffer.personas.map(p => [p[0], '@']);
  const voiced = (buffer.lurkers || []).slice(0, 6).map(n => [n, '+']);
  const plain = (buffer.lurkers || []).slice(6).map(n => [n, '']);
  const all = [...ops, ...voiced, ...plain, [me, '']];

  const rows = [];
  for (let i = 0; i < all.length; i += NAME_COLS) {
    const slice = all.slice(i, i + NAME_COLS);
    const cells = slice.map(([n, pre]) => fmtNameCell(n, pre)).join(' ');
    rows.push(cells);
  }
  return { rows, count: all.length };
}

// =================== mention detection ===================

function containsMention(text, nick) {
  if (!nick) return false;
  const safe = nick.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(`(^|[\\s,])@?${safe}([\\s,:;!?.]|$)`, 'i');
  return re.test(text);
}
function findMentions(text, candidates) {
  const hits = [];
  for (const c of candidates) if (containsMention(text, c)) hits.push(c);
  return hits;
}

// =================== llm ===================

async function ensureLLM() {
  if (state.llm) return state.llm;
  if (typeof LanguageModel === 'undefined') throw new Error('LanguageModel API not present');
  let avail = 'available';
  if (typeof LanguageModel.availability === 'function') avail = await LanguageModel.availability();
  if (avail === 'unavailable') throw new Error('on-device model unavailable');
  const opts = {};
  if (avail === 'downloadable' || avail === 'downloading') {
    console.info('on-device model is downloading...');
    opts.monitor = (m) => {
      m.addEventListener('downloadprogress', (e) => {
        const pct = Math.round((e.loaded ?? 0) * 100);
        renderStatus();
        sysToCurrent(`...download ${pct}%`, 'info');
      });
    };
  }
  // higher temperature + topK so two personas asked similar things don't
  // come back with byte-identical replies. The single shared session
  // accumulating history was producing duplicate output across personas.
  opts.temperature = 1.0;
  opts.topK = 8;
  state.llm = await LanguageModel.create(opts);
  state.modelReady = true;
  renderStatus();
  return state.llm;
}
async function llmPrompt(text) {
  // Clone the session per prompt so each persona reply is independent.
  // The single shared session accumulates conversation history and biases
  // subsequent personas toward repeating earlier output verbatim. Clone
  // descends from the parent's initial system prompt but does not share
  // turn history.
  const llm = await ensureLLM();
  let session = null;
  try {
    session = (typeof llm.clone === 'function') ? await llm.clone() : llm;
    return await session.prompt(text);
  } finally {
    if (session && session !== llm && typeof session.destroy === 'function') {
      try { session.destroy(); } catch (e) { /* swallow */ }
    }
  }
}

// =================== queue ===================

async function runQueue() {
  if (state.queueRunning) return;
  state.queueRunning = true;
  try {
    while (state.callQueue.length) {
      state.callQueue.sort((a, b) => a.scheduledAt - b.scheduledAt);
      const now = Date.now();
      const next = state.callQueue[0];
      if (next.scheduledAt > now) {
        await sleep(Math.min(next.scheduledAt - now, 500));
        continue;
      }
      state.callQueue.shift();
      try { await next.fn(); }
      catch (err) { console.error('queue fn error:', err); }
      finally { state.pendingResponses = Math.max(0, state.pendingResponses - 1); renderStatus(); }
    }
  } finally {
    state.queueRunning = false;
  }
}
function enqueue(fn, delayRange) {
  const [a, b] = delayRange;
  state.pendingResponses++;
  renderStatus();
  state.callQueue.push({ fn, scheduledAt: Date.now() + rand(a, b) });
  runQueue();
}

const MUSIC_FILE = 'sky_sunday.xm';
const music = {
  player: null,
  buffer: null,
  status: 'stopped',
  title: null,

  available() { return typeof ChiptuneJsPlayer !== 'undefined'; },

  async ensurePlayer() {
    if (!this.available()) throw new Error('chiptune2.js failed to load (CDN blocked?)');
    if (!this.player) {
      // ChiptuneJsConfig(repeatCount, stereoSeparation, interpolationFilter, context)
      // repeatCount: -1 loops forever
      // stereoSeparation: 0-200 (100 = normal)
      // interpolationFilter: 0 none, 1 linear, 2 cubic, 8 sinc (8 = best)
      this.player = new ChiptuneJsPlayer(new ChiptuneJsConfig(-1, 100, 8));
      this.player.onError(err => {
        console.warn('chiptune error', err);
      });
    }
    // chrome blocks AudioContext until user gesture. /music on is called from a
    // keydown handler, which counts as a gesture, so resume should succeed.
    const ctx = this.player.context;
    if (ctx && ctx.state === 'suspended') {
      try { await ctx.resume(); } catch {}
    }
    return this.player;
  },

  async loadBuffer() {
    await this.ensurePlayer();
    if (this.buffer) return this.buffer;
    return await new Promise((resolve, reject) => {
      this.player.load(MUSIC_FILE, (buffer, err) => {
        if (err || !buffer) return reject(new Error('failed to load ' + MUSIC_FILE));
        this.buffer = buffer;
        resolve(buffer);
      });
    });
  },

  async play() {
    await this.ensurePlayer();
    const buf = await this.loadBuffer();
    this.player.play(buf);
    this.status = 'playing';
    try {
      const meta = this.player.metadata() || {};
      this.title = meta.title || 'sky sunday';
      return { title: this.title, artist: meta.artist || '', tracker: meta.tracker || '' };
    } catch { return { title: 'sky sunday', artist: '', tracker: '' }; }
  },

  stop() {
    if (this.player) {
      try { this.player.stop(); } catch {}
    }
    this.status = 'stopped';
  },

  togglePause() {
    if (this.player) {
      try { this.player.togglePause(); } catch {}
    }
  }
};

// =================== persona generation (era-aware) ===================

async function generatePersonas(chan, topic) {
  const prompt =
`You are populating an IRC channel ${chan} on ${currentNet().name} (${currentNet().flavour}). Year: ${SIM_YEAR}. Topic: "${topic}".

Generate 10 memorable IRC regulars. Each should be a sharp, bash.org-quotable character with a strong opinion or a quirk that fuels one-liner humour. Examples of memorable traits: "thinks emacs is a religion and vim is satanism", "Win95 box BSOD-frozen so reliably uptime is measured in dust thickness", "writes shell scripts in his sleep, can't read them awake", "still uses gopher, claims the web is a fad", "phreaks payphones to call his mother", "got fired for accidentally tar-bombing /tmp on the prod box".

Avoid anachronisms: no smartphones, github, react, kubernetes, transformers, twitter. Reference period tech: Linux 2.0/2.2, FreeBSD 3, Win95/98/NT4, Solaris, IRIX, BeOS, mIRC, Eggdrop, 56k modems, Phrack, 2600, ICQ, Back Orifice, NetBus, nmap, L0pht, cDc, THC.

Output ONLY a list, one user per line, in this exact format:
@nickname :: one or two sentence persona with a clear quirk

Rules:
- lowercase nicks, 4-12 chars, digits and underscores allowed, no spaces
- no real famous people by name
- mix personalities, backgrounds, expertise
- no introductions, no numbering, no extra text before or after the list`;

  let out;
  try { out = await llmPrompt(prompt); }
  catch (e) { console.warn('persona gen failed, using fallback:', e); return FALLBACK_PERSONAS.default.slice(); }

  const parse = (text) => {
    const lines = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const acc = [];
    for (const line of lines) {
      const m = line.match(/^@?([a-zA-Z0-9_\-]{3,16})\s*(?:::|:|-|—)\s*(.{4,300})$/);
      if (m) acc.push([m[1].toLowerCase(), m[2].trim()]);
    }
    return acc;
  };

  let parsed = parse(out);
  if (parsed.length < 5) {
    try { parsed = parsed.concat(parse(await llmPrompt(prompt))); } catch {}
  }
  const seen = new Set(), uniq = [];
  for (const [n, d] of parsed) {
    if (seen.has(n)) continue;
    seen.add(n); uniq.push([n, d]);
  }
  if (uniq.length < 5) return FALLBACK_PERSONAS.default.slice();
  return uniq.slice(0, 12);
}

function generateLurkers(count) {
  const pool = LURKER_POOL.slice();
  const out = [];
  for (let i = 0; i < count && pool.length; i++) {
    out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return out;
}

// =================== response generation prompts ===================

// Recent chat lines for prompt context. Format is "nick: msg", NOT "<nick> msg",
// because the angle-bracket form confused the on-device model into continuing
// the transcript as its response output.
function recentChatLines(buffer, n=6) {
  const lines = [];
  const slice = buffer.transcript.slice(-n);
  for (const e of slice) {
    if (e.kind === 'msg') lines.push(`${e.nick}: ${e.text}`);
    else if (e.kind === 'me') lines.push(`* ${e.nick} ${e.text}`);
    else if (e.kind === 'topic') lines.push(`[topic: ${e.text}]`);
  }
  return lines.join('\n');
}
function lastUserMessage(buffer) {
  // most recent message from the human (state.nick), so a persona can quote
  // exactly what the user just said when replying to a mention.
  for (let i = buffer.transcript.length - 1; i >= 0; i--) {
    const e = buffer.transcript[i];
    if (e.kind === 'msg' && e.nick === state.nick) return e;
  }
  return null;
}
function lastNonOwnMessage(buffer, ownNick) {
  // most recent message from anyone except ownNick, so a persona reacts to
  // the right thing rather than to itself.
  for (let i = buffer.transcript.length - 1; i >= 0; i--) {
    const e = buffer.transcript[i];
    if (e.kind === 'msg' && e.nick !== ownNick) return e;
  }
  return null;
}
function personaFor(buffer, nick) { return buffer.personas.find(p => p[0] === nick); }

// Strict reply cleaner. The on-device model frequently leaks the transcript
// format as its reply (<nick> blah <silence> <foo> blah), or prefixes with
// its own nickname / "Reply:" / quotes. Detect leaked tags and chop at the
// first one. If the whole reply IS a leaked transcript, return empty so
// isSilence drops it.
function cleanReply(raw, personaNick) {
  if (raw == null) return '';
  let s = String(raw).trim();

  s = s.replace(/^```[a-zA-Z]*\s*/m, '').replace(/```\s*$/m, '').trim();
  s = s.replace(/^(reply|response|output|answer|message|user|assistant)\s*[:>\-]+\s*/i, '').trim();
  s = s.replace(/^["'`]+|["'`]+$/g, '').trim();

  const np = personaNick.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  s = s.replace(new RegExp(`^<${np}>\\s*`, 'i'), '');
  s = s.replace(new RegExp(`^@?${np}\\s*[:>|\-]\\s*`, 'i'), '');
  s = s.trim();

  // catch leaked <silence>, <nick>, <Eggdrop>, etc anywhere in the output
  const m = s.match(/<[a-zA-Z_][a-zA-Z0-9_\-]{0,20}>/);
  if (m) {
    if (m.index === 0) return '';
    s = s.substring(0, m.index).trim();
  }

  // Preserve newlines so personas can post multi-line ASCII art. Cap at 5
  // lines so a runaway response can't flood the channel.
  const lines = s.split(/\r?\n/).map(l => l.replace(/\s+$/, '')).filter(l => l.length > 0);
  s = lines.slice(0, 5).join('\n');
  s = s.replace(/[\s:;]+$/g, '').trim();
  if (s.length > 500) s = s.slice(0, 500);
  return s;
}
function isSilence(reply) {
  if (!reply) return true;
  const s = reply.trim().toLowerCase();
  if (!s) return true;
  if (/^[\s\*\(\[<]*silence[\s\*\)\]>]*$/i.test(s)) return true;
  if (/^[\s\*\(\[]*skip[\s\*\)\]\.]*$/i.test(s)) return true;
  if (/^\(?(no\s+response|nothing|pass|no\s*comment|no\s*reply|n\/a|none)\)?\.?$/i.test(s)) return true;
  if (s.length < 2) return true;
  if (!/[a-zA-Z]/.test(s)) return true;
  return false;
}

const ERA_NOTE = `Year is ${SIM_YEAR}. Reference only late-90s tech: Linux 2.0/2.2, FreeBSD 3, Win95/98/NT4, BeOS, mIRC, Eggdrop, 56k modems, Phrack, 2600, ICQ, Back Orifice, NetBus, nmap, Quake/Quake2/Half-Life, Geocities, Y2K. Nothing past 1999.`;

// Probability knobs for multi-turn conversation. After any persona emits,
// we may chain another background reply from a different (non-cooldown)
// persona, producing real back-and-forth instead of one-shot answers.
const CONTINUE_CHANCE = 0.18;
const CONTINUE_PROB_PER_PERSONA = 0.40;

// ASCII art replies may span multiple lines; emit each as its own IRC line.
function emitChatReply(buffer, nick, reply) {
  const lines = reply.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  for (const line of lines) {
    emit(buffer, { ts: hhmm24(), kind: 'msg', nick, text: line });
  }
}

function maybeContinueConversation(buffer, lastSpeaker) {
  // Disabled: generateChannelTurn produces the whole multi-persona response
  // in one shot, so per-line continuation chains aren't needed.
  return;
  // eslint-disable-next-line no-unreachable
  if (Math.random() > CONTINUE_CHANCE) return;
  const actives = activeArr(buffer);
  const candidates = actives.filter(p =>
    p[0] !== lastSpeaker &&
    !recentlySpoke(buffer, p[0], COOLDOWN_MS)
  );
  if (!candidates.length) return;
  shuffleInPlace(candidates);
  if (Math.random() > CONTINUE_PROB_PER_PERSONA) return;
  const responder = candidates[0];
  enqueue(() => generateBackgroundReply(buffer, responder), BACKGROUND_DELAY);
}

// One-prompt channel turn. Replaces the old per-persona dispatch (mentioned /
// background / continue chain) with a single LLM call that returns the next
// 0-3 messages from active personas. This makes duplicates impossible by
// construction (the model sees what it has already written for other
// personas in the same response) and uses promptStreaming so each persona's
// line lands as soon as it is complete, instead of waiting for the whole
// turn to finish generating.
async function generateChannelTurn(buffer, opts = {}) {
  const { mentionedNicks = [] } = opts;
  const actives = activeArr(buffer);
  if (!actives.length) return;

  // Build the persona dossier the LLM uses to decide who chimes in.
  const personaList = actives
    .map(p => `@${p[0]}: ${p[1]}`)
    .join('\n');
  const ctx = recentChatLines(buffer, 10);
  const userMsg = lastUserMessage(buffer);
  const userMsgText = userMsg ? userMsg.text : '(no recent user message)';

  const mentionInstr = mentionedNicks.length
    ? `${state.nick} addressed the following personas directly: ${mentionedNicks.map(n => '@' + n).join(', ')}. Each addressed persona replies, one line each. NO other personas chime in unless one would genuinely care.`
    : `${state.nick} did not address anyone by name. Most messages in a busy IRC channel get NO immediate reply - skipping is the default. Only generate 1 reaction if a specific persona would genuinely care about this exact message. SKIP otherwise.`;

  const prompt =
`You are scripting one short turn of a live IRC channel ${buffer.name} on EFnet, ${SIM_YEAR}.

ACTIVE PERSONAS (each has a distinct personality - never make two of them say the same thing):
${personaList}

${state.nick} is the HUMAN USER. Never script lines for ${state.nick}.

Recent channel conversation (oldest at top, newest at bottom):
${ctx}

${state.nick}'s most recent message was:
"${userMsgText}"

${mentionInstr}

${TONE_GUIDE}

OUTPUT FORMAT - strict:
- One persona reply per line, format exactly:  nick: message
- Pick from the ACTIVE PERSONAS list. Never invent new nicks.
- Each persona speaks AT MOST ONCE in your output.
- Different personas must say DIFFERENT things. No echoing. No paraphrasing each other.
- MAX 12 WORDS per message. IRC is terse - real lines are 4-12 words.
- NO paragraphs. NO multiple sentences explaining yourself.
- ENGAGE with what ${state.nick} actually said - answer their question, react to their statement, acknowledge them.
- Total: 0 to 2 lines. Most messages get only 0 or 1 reply - that's normal IRC. If addressed personas exist, those reply; otherwise often nobody chimes in.
- If genuinely no one would chime in, output only: SKIP
- Output NOTHING ELSE. No preamble, no commentary, no numbering, no quotes around messages.

Example shape (illustrative, do not copy):
kr4d: lol same here, mine drops constantly
nullptr: try ppp dial-on-demand if your isp supports it

Begin output now:`;

  try {
    const llm = await ensureLLM();
    let session = null;
    try {
      session = (typeof llm.clone === 'function') ? await llm.clone() : llm;
      if (typeof session.promptStreaming === 'function') {
        await streamChannelTurn(buffer, session, prompt, actives);
      } else {
        const raw = await session.prompt(prompt);
        await emitChannelTurnFromText(buffer, raw, actives);
      }
    } finally {
      if (session && session !== llm && typeof session.destroy === 'function') {
        try { session.destroy(); } catch (e) { /* ignore */ }
      }
    }
  } catch (err) { console.warn('channel turn failed:', err); }
  resetIdleTimer();
}

// Hard cap on replies per turn even if the LLM hallucinates extra lines.
// At most 3 (one addressed persona + up to 2 bystanders). The prompt asks for
// 0-2 already; this guards against overshoot.
const MAX_REPLIES_PER_TURN = 3;

async function streamChannelTurn(buffer, session, prompt, actives) {
  const stream = session.promptStreaming(prompt);
  const validNicks = new Set(actives.map(p => p[0]));
  const seen = new Set();
  // Shared emission state across all line drains for this turn so typing
  // delays compound properly between successive lines.
  const turnState = {
    emittedCount: 0,
    lastEmitAt: 0  // wall-clock ms of the most recent emit (0 = none yet)
  };
  let buf = '';

  if (stream && typeof stream[Symbol.asyncIterator] === 'function') {
    for await (const chunk of stream) {
      buf += chunk;
      buf = await drainCompleteLines(buffer, buf, validNicks, seen, turnState);
      if (turnState.emittedCount >= MAX_REPLIES_PER_TURN) return;
    }
  } else if (stream && typeof stream.getReader === 'function') {
    const reader = stream.getReader();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      buf = await drainCompleteLines(buffer, buf, validNicks, seen, turnState);
      if (turnState.emittedCount >= MAX_REPLIES_PER_TURN) return;
    }
  }
  if (buf.trim() && turnState.emittedCount < MAX_REPLIES_PER_TURN) {
    await maybeEmitTurnLine(buffer, buf.trim(), validNicks, seen, turnState);
  }
}

async function drainCompleteLines(buffer, buf, validNicks, seen, turnState) {
  let nl;
  while ((nl = buf.indexOf('\n')) !== -1) {
    const line = buf.slice(0, nl).trim();
    buf = buf.slice(nl + 1);
    if (line && turnState.emittedCount < MAX_REPLIES_PER_TURN) {
      await maybeEmitTurnLine(buffer, line, validNicks, seen, turnState);
    }
  }
  return buf;
}

async function emitChannelTurnFromText(buffer, raw, actives) {
  // non-streaming fallback path - same emission discipline as streaming.
  const validNicks = new Set(actives.map(p => p[0]));
  const seen = new Set();
  const turnState = { emittedCount: 0, lastEmitAt: 0 };
  const lines = String(raw || '').split(/\r?\n/);
  for (const line of lines) {
    if (turnState.emittedCount >= MAX_REPLIES_PER_TURN) break;
    const t = line.trim();
    if (t) await maybeEmitTurnLine(buffer, t, validNicks, seen, turnState);
  }
}

async function maybeEmitTurnLine(buffer, line, validNicks, seen, turnState) {
  if (turnState.emittedCount >= MAX_REPLIES_PER_TURN) return;
  const parsed = parseTurnLine(line, validNicks, seen);
  if (!parsed) return;
  seen.add(parsed.nick);

  // Realistic IRC pacing. Real humans take a beat to read the message,
  // decide to respond, type something, then send.
  // - First reply per turn: 2-6s of think time before anyone starts typing.
  // - Subsequent replies: 4-13s gap from the previous emit (the next person
  //   sees the channel activity, considers, types).
  // - Plus typing time proportional to message length (~110ms/word).
  const wordCount = parsed.text.split(/\s+/).length;
  const typingMs = wordCount * rand(90, 160);
  const isFirst = turnState.emittedCount === 0;
  const thinkMs = isFirst ? rand(2000, 6000) : rand(4000, 13000);
  // For subsequent replies, the gap is measured from the last emit, not the
  // start of the turn - so several lines spread out organically.
  const since = turnState.lastEmitAt ? (Date.now() - turnState.lastEmitAt) : Infinity;
  const remaining = Math.max(0, thinkMs - (isFirst ? 0 : Math.min(since, thinkMs)));
  await new Promise(r => setTimeout(r, remaining + typingMs));

  emitChatReply(buffer, parsed.nick, parsed.text);
  turnState.emittedCount += 1;
  turnState.lastEmitAt = Date.now();
}

function parseTurnLine(line, validNicks, seenNicks) {
  if (!line) return null;
  if (/^skip\.?$/i.test(line)) return null;
  // strip common preambles / list markers
  line = line.replace(/^\s*\d+[\.\)]\s*/, '');
  line = line.replace(/^\s*[\*\-]\s*/, '');
  line = line.replace(/^(?:reply|response|output|message)\s*[:>]\s*/i, '');
  // strip [hh:mm] timestamps the model occasionally adds
  line = line.replace(/^\[\s*\d{1,2}:\d{2}(?::\d{2})?\s*\]\s*/, '');
  // <nick> form
  let m = line.match(/^<([\w\-\[\]\\\|`\^{}]+)>\s*(.+)$/);
  if (!m) {
    // nick: text (or "@nick: text", "nick> text", "nick says: text")
    m = line.match(/^@?([\w\-\[\]\\\|`\^{}]+)\s*(?:says?|replies|responds?)?\s*[:>]\s*(.+)$/i);
  }
  if (!m) return null;
  const nick = m[1];
  if (!validNicks.has(nick)) return null;
  if (seenNicks.has(nick)) return null;
  let text = m[2].trim().replace(/^["\u201c\u2018]+|["\u201d\u2019]+$/g, '').trim();
  if (!text || /^skip\.?$/i.test(text)) return null;
  // strip stray angle-bracket leftovers from cleanReply heuristics
  text = text.replace(/<[^>]{0,20}>/g, '').trim();
  if (!text) return null;
  // enforce hard 25-word ceiling - even if prompt said 12, the model sometimes overshoots
  const words = text.split(/\s+/);
  if (words.length > 25) text = words.slice(0, 25).join(' ') + '...';
  return { nick, text };
}

async function generateMentionedReply(buffer, persona) {
  const [nick, desc] = persona;
  const ctx = recentChatLines(buffer, 8);
  const userMsg = lastUserMessage(buffer);
  const userMsgText = userMsg ? userMsg.text : '';
  const prompt =
`You are ${nick} on EFnet IRC channel ${buffer.name}.
Your personality: ${desc}.
${ERA_NOTE}

The human user ${state.nick} just addressed you with this exact message:
"${userMsgText}"

Recent channel context (oldest to newest):
${ctx}

${TONE_GUIDE}

CRITICAL - respond to what ${state.nick} ACTUALLY SAID:
- If they asked a question, ANSWER it. Don't deflect.
- If they introduced themselves (e.g. "My name is X"), ACKNOWLEDGE the name.
- If they made a statement, REACT to that specific statement.
- Do NOT pivot to your usual hobby horse - engage with their message.
- You can still be in character, but be a real person about it.

OUTPUT RULES:
- ONE line, MAX 12 WORDS. IRC is terse - real replies are 4-12 words.
- NO paragraphs. NO multiple sentences explaining yourself. NO essays.
- (Up to 5 lines only for genuine ASCII art.)
- No nickname prefix. No angle brackets. No quotes. No "Reply:" preamble.`;
  try {
    const raw = await llmPrompt(prompt);
    const reply = cleanReply(raw, nick);
    if (!isSilence(reply)) {
      emitChatReply(buffer, nick, reply);
      resetIdleTimer();
      maybeContinueConversation(buffer, nick);
    }
  } catch (err) { console.warn('mention reply failed for', nick, err); }
}

async function generateBackgroundReply(buffer, persona) {
  const [nick, desc] = persona;
  const ctx = recentChatLines(buffer, 8);
  const latest = lastNonOwnMessage(buffer, nick);
  const latestSpeaker = latest ? latest.nick : '';
  const latestText = latest ? latest.text : '';
  const prompt =
`You are ${nick} on EFnet IRC channel ${buffer.name}.
Your personality: ${desc}.
${ERA_NOTE}

Recent channel context (oldest to newest):
${ctx}

The latest message that is NOT yours was from ${latestSpeaker}:
"${latestText}"

${TONE_GUIDE}

Would ${nick} react to that specific message? If YES, respond to what ${latestSpeaker} actually said (agree, disagree, joke about it, ask a follow-up). If you would not bother to chime in here, output the single word: SKIP

CRITICAL:
- React to ${latestSpeaker}'s actual message, not your usual character topics.
- If ${latestSpeaker} asked something, answer in character.
- If ${latestSpeaker} introduced themselves or stated a fact, engage with that.
- Don't monologue your character description, talk WITH them.

OUTPUT RULES:
- Either ONE line of MAX 12 WORDS, OR just: SKIP
- IRC is terse - real reactions are 4-12 words.
- NO paragraphs. NO multiple sentences. NO essays.
- No nickname prefix. No angle brackets. No quotes. No preamble.`;
  try {
    const raw = await llmPrompt(prompt);
    const reply = cleanReply(raw, nick);
    if (!isSilence(reply)) {
      emitChatReply(buffer, nick, reply);
      resetIdleTimer();
      maybeContinueConversation(buffer, nick);
    }
  } catch (err) { console.warn('background reply failed for', nick, err); }
}

async function generateProactive(buffer, persona) {
  const [nick, desc] = persona;
  const ctx = recentChatLines(buffer, 3);
  const prompt =
`You are ${nick} on EFnet IRC channel ${buffer.name}.
Your personality: ${desc}.
${ERA_NOTE}

${TONE_GUIDE}

Examples of bash.org-quotable IRC one-liners (do NOT reproduce, just match their energy):
${pickQuotes(3)}

Last few channel messages (may be stale):
${ctx || '(channel has been quiet)'}

The channel has been silent. Drop a one-liner to kick off a new thread: a complaint, a recent frustration, a strong opinion, a question, a non-sequitur in your voice. This is the one prompt where you ARE just monologuing your character - no message to react to.

OUTPUT RULES:
- ONE line, MAX 15 WORDS. IRC is terse.
- NO paragraphs. NO multiple sentences explaining yourself.
- (Up to 5 lines only for genuine ASCII art.)
- No nickname prefix. No angle brackets. No quotes. No "Reply:" preamble.`;
  try {
    const raw = await llmPrompt(prompt);
    const reply = cleanReply(raw, nick);
    if (!isSilence(reply)) {
      emitChatReply(buffer, nick, reply);
      resetIdleTimer();
      maybeContinueConversation(buffer, nick);
    }
  } catch (err) { console.warn('proactive failed for', nick, err); }
}

// =================== triggering ===================

function activeArr(buffer) { return buffer.personas.filter(p => buffer.active.has(p[0])); }
function ensurePersonaActive(buffer, nick) {
  const persona = personaFor(buffer, nick);
  if (!persona) return false;
  if (buffer.active.has(nick)) return true;
  buffer.active.add(nick);
  return true;
}

function onUserMessage(buffer, text) {
  // ELIZA fallback: pure pattern-matching, no LLM, no background activity.
  if (state.mode === 'eliza') {
    setTimeout(() => {
      const reply = elizaRespond(text);
      emit(buffer, { ts: hhmm24(), kind: 'msg', nick: ELIZA_NICK, text: reply });
    }, rand(800, 2200));
    return;
  }
  const allNicks = buffer.personas.map(p => p[0]);
  const mentioned = findMentions(text, allNicks);
  for (const n of mentioned) ensurePersonaActive(buffer, n);

  // One LLM call, the model produces the full next round of replies for the
  // active personas. No more per-persona dispatch, no continue-chain.
  enqueue(() => generateChannelTurn(buffer, { mentionedNicks: mentioned }), MENTION_DELAY);
  resetIdleTimer();
}

// =================== idle proactive ===================

// =================== background atmosphere (joins/parts/netsplits) ===================
// Pure-JS background events, no LLM. Lurkers come and go between human
// messages so the channel feels populated instead of frozen.
let bgEventTimer = null;

function scheduleBackgroundEvent() {
  if (bgEventTimer) clearTimeout(bgEventTimer);
  // No background atmosphere in ELIZA mode - she gets you alone in #love.
  if (state.mode === 'eliza') return;
  const delay = BG_EVENT_BASE_MS + Math.floor(Math.random() * BG_EVENT_JITTER_MS);
  bgEventTimer = setTimeout(tickBackgroundEvent, delay);
}

function tickBackgroundEvent() {
  const b = currentBuffer();
  if (!b || b.type !== 'channel') { scheduleBackgroundEvent(); return; }
  try { doBackgroundEvent(b); } catch (e) { console.warn('bg event failed:', e); }
  scheduleBackgroundEvent();
}

function doBackgroundEvent(buffer) {
  const lurkers = buffer.lurkers || [];
  const cur = lurkers.length;
  // small chance of an op-driven action regardless of population
  if (lurkers.length >= 2 && Math.random() < 0.08) {
    doOpKick(buffer);
    return;
  }
  // bias towards keeping lurker count in a stable range
  const targetMin = 5, targetMax = 18;
  let preferQuit;
  if (cur < targetMin) preferQuit = false;
  else if (cur > targetMax) preferQuit = true;
  else preferQuit = Math.random() < 0.5;

  if (preferQuit && lurkers.length > 5) {
    // 12% chance of netsplit instead of a regular quit
    if (Math.random() < 0.12 && lurkers.length >= 6) doNetsplit(buffer);
    else doQuit(buffer);
  } else {
    doJoin(buffer);
  }
}

function doQuit(buffer) {
  const lurkers = buffer.lurkers;
  if (!lurkers.length) return;
  const idx = Math.floor(Math.random() * lurkers.length);
  const nick = lurkers[idx];
  const reason = pick(QUIT_REASONS);
  lurkers.splice(idx, 1);
  emit(buffer, { ts: hhmm24(), kind: 'quit', nick, host: fakeHost(nick), reason });
  persistBuffer(buffer);
}

function doJoin(buffer) {
  const taken = new Set([
    ...buffer.lurkers,
    ...buffer.personas.map(p => p[0]),
    state.nick
  ]);
  const fresh = LURKER_POOL.filter(n => !taken.has(n));
  if (!fresh.length) return;
  const nick = pick(fresh);
  buffer.lurkers.push(nick);
  emit(buffer, { ts: hhmm24(), kind: 'join', nick, host: fakeHost(nick), chan: buffer.name });
  persistBuffer(buffer);
}

function doNetsplit(buffer) {
  const lurkers = buffer.lurkers;
  if (lurkers.length < 3) return;
  const count = Math.min(rand(3, 7), lurkers.length);
  const reason = pick(NETSPLIT_PAIRS);
  const taken = [];
  for (let i = 0; i < count; i++) {
    if (!lurkers.length) break;
    const idx = Math.floor(Math.random() * lurkers.length);
    taken.push(lurkers.splice(idx, 1)[0]);
  }
  for (const nick of taken) {
    emit(buffer, { ts: hhmm24(), kind: 'quit', nick, host: fakeHost(nick), reason });
  }
  persistBuffer(buffer);
  // schedule a netjoin in 25-90s. Real splits eventually heal.
  const splitNicks = taken.slice();
  const splitServers = reason;
  setTimeout(() => doNetjoin(buffer, splitNicks, splitServers), rand(25_000, 90_000));
}

function doNetjoin(buffer, nicks, servers) {
  if (!buffer || !nicks.length) return;
  // re-add nicks to lurkers, deduped against current lurkers/personas
  const taken = new Set([
    ...(buffer.lurkers || []),
    ...buffer.personas.map(p => p[0]),
    state.nick
  ]);
  const rejoining = nicks.filter(n => !taken.has(n));
  for (const n of rejoining) buffer.lurkers.push(n);
  emit(buffer, { ts: hhmm24(), kind: 'netjoin', chan: buffer.name, servers, nicks: rejoining });
  persistBuffer(buffer);
  // 15% chance the netjoin triggers a takeover
  if (rejoining.length >= 3 && Math.random() < 0.15) {
    setTimeout(() => doTakeover(buffer), rand(2_000, 8_000));
  }
}

function doOpKick(buffer) {
  // pick a persona (with @ op) as the kicker, and a victim - prefer a lurker,
  // sometimes a less-active persona, never the user.
  if (!buffer.personas.length || !buffer.lurkers.length) return;
  const opNick = pick(buffer.personas)[0];
  let victim;
  if (Math.random() < 0.85) {
    // kick a lurker
    const idx = Math.floor(Math.random() * buffer.lurkers.length);
    victim = buffer.lurkers[idx];
    buffer.lurkers.splice(idx, 1);
  } else {
    // sometimes set a ban-mask first (no actual kick, just the +b line)
    const mask = pick(BAN_MASKS);
    emit(buffer, { ts: hhmm24(), kind: 'mode', chan: buffer.name, modes: '+b ' + mask, by: opNick });
    persistBuffer(buffer);
    return;
  }
  if (!victim) return;
  // 30% chance: set +b first, then kick (the classic kickban)
  if (Math.random() < 0.30) {
    const ident = victim.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0, 8) || 'user';
    const mask = `*!*${ident}@*`;
    emit(buffer, { ts: hhmm24(), kind: 'mode', chan: buffer.name, modes: '+b ' + mask, by: opNick });
  }
  emit(buffer, { ts: hhmm24(), kind: 'kick', chan: buffer.name, victim, by: opNick, reason: pick(KICK_REASONS) });
  persistBuffer(buffer);
}

function doTakeover(buffer) {
  if (!buffer.lurkers.length) return;
  // pick a previously-non-op lurker to become the new "op"
  const takeoverNick = pick(buffer.lurkers);
  emit(buffer, { ts: hhmm24(), kind: 'mode', chan: buffer.name, modes: '+o ' + takeoverNick, by: 'irc.split-server.net' });
  emit(buffer, { ts: hhmm24(), kind: 'msg', nick: takeoverNick, text: pick([
    'channel is mine now lol', 'haha owned', 'who left ops floating', 'thx for the @',
    'free ops while servers reroute, suckers', 'finally'
  ]) });
  // 50% chance: topic change
  if (Math.random() < 0.5) {
    emit(buffer, { ts: hhmm24(), kind: 'topic', chan: buffer.name, text: pick(TAKEOVER_TOPICS) });
  }
  // mass kick 3-6 random victims (prefer lurkers, not personas, not the user)
  const victims = shuffleInPlace(buffer.lurkers.filter(n => n !== takeoverNick)).slice(0, rand(3, 6));
  for (const v of victims) {
    const idx = buffer.lurkers.indexOf(v);
    if (idx >= 0) buffer.lurkers.splice(idx, 1);
    emit(buffer, { ts: hhmm24(), kind: 'kick', chan: buffer.name, victim: v, by: takeoverNick, reason: pick(TAKEOVER_KICK_REASONS) });
  }
  persistBuffer(buffer);
  // takeover restoration in 25-60s: original ops show back up and deop the squatter
  setTimeout(() => {
    if (!buffer.personas.length) return;
    const realOp = pick(buffer.personas)[0];
    emit(buffer, { ts: hhmm24(), kind: 'mode', chan: buffer.name, modes: '-o+b ' + takeoverNick + ' *!*@*' + (takeoverNick.slice(-3)) + '*', by: realOp });
    emit(buffer, { ts: hhmm24(), kind: 'kick', chan: buffer.name, victim: takeoverNick, by: realOp, reason: 'enjoy your k-line, takeover lamer' });
    const tIdx = buffer.lurkers.indexOf(takeoverNick);
    if (tIdx >= 0) buffer.lurkers.splice(tIdx, 1);
    emit(buffer, { ts: hhmm24(), kind: 'topic', chan: buffer.name, text: currentNet().channels[buffer.name] || 'general chatter' });
    persistBuffer(buffer);
  }, rand(25_000, 60_000));
}

function resetIdleTimer() {
  if (state.idleTimer) clearTimeout(state.idleTimer);
  const b = currentBuffer();
  if (!b || b.type !== 'channel') return;
  const delay = IDLE_BASE_MS + Math.floor(Math.random() * IDLE_JITTER_MS);
  state.idleTimer = setTimeout(() => onIdleTick(b), delay);
}
function onIdleTick(buffer) {
  if (buffer !== currentBuffer()) return;
  const actives = activeArr(buffer);
  if (!actives.length) { resetIdleTimer(); return; }
  // skip personas that just spoke
  const eligible = actives.filter(p => !recentlySpoke(buffer, p[0], COOLDOWN_MS * 2));
  const pool = eligible.length ? eligible : actives;
  enqueue(() => generateProactive(buffer, pick(pool)), PROACTIVE_DELAY);
  resetIdleTimer();
}

// =================== channel ops ===================

async function joinChannel(name, opts = {}) {
  const switchTo = opts.switchTo !== false;
  name = name.toLowerCase();
  if (!name.startsWith('#')) name = '#' + name;
  let b = bufferByName(name);
  if (b) {
    if (switchTo) {
      state.currentIdx = bufferIndex(name);
      redrawBuffer();
    }
    persistAll();
    return b;
  }
  // Defensive defaults: personas/lurkers are arrays from the start so that
  // any renderStatus() call before they are populated does not blow up on
  // null.length.
  b = {
    name, type: 'channel',
    personas: nls.get(`personas:${name}`, []) || [],
    active: new Set(nls.get(`active:${name}`, [])),
    transcript: nls.get(`transcript:${name}`, []) || [],
    lurkers: nls.get(`lurkers:${name}`, []) || [],
    lastSpoke: new Map()
  };
  state.buffers.push(b);
  if (switchTo) {
    state.currentIdx = state.buffers.length - 1;
    redrawBuffer();
  }

  const channels = currentNet().channels;
  const topic = channels[name] || 'general chatter';
  // First-join detection: empty personas means this channel has not been
  // generated yet on this network.
  const firstJoin = b.personas.length === 0;

  if (firstJoin) {
    emit(b, { ts: hhmm24(), kind: 'info', text: `Joining ${name}...` });
    if (state.mode === 'eliza') {
      // #love (or any channel in ELIZA mode) has exactly one other "user".
      b.personas = [[ELIZA_NICK, 'Rogerian psychotherapist, MIT 1966, listens patiently']];
      b.active = new Set([ELIZA_NICK]);
      b.lurkers = [];
      const elizaTopic = name === '#love'
        ? 'tell me about your problems | ELIZA listens | DOCTOR.SCRIPT loaded'
        : '(empty channel - ELIZA mode is single-user with #love)';
      emit(b, { ts: hhmm24(), kind: 'join', nick: state.nick, host: fakeHost(state.nick), chan: name });
      emit(b, { ts: hhmm24(), kind: 'topic', chan: name, text: elizaTopic });
      emit(b, { ts: hhmm24(), kind: 'topicby', chan: name, who: ELIZA_NICK,
                when: 'Sat Jan  1 09:30:00 1966' });
      const { rows, count } = buildNamesGrid(b);
      emit(b, { ts: hhmm24(), kind: 'users', chan: name, count, rows });
      emit(b, { ts: hhmm24(), kind: 'mode', chan: name, modes: '+ntr', by: 'ChanServ' });
      if (name === '#love') {
        setTimeout(() => emit(b, { ts: hhmm24(), kind: 'msg', nick: ELIZA_NICK,
          text: 'Hello. I am ELIZA. How are you feeling today?' }), 1200);
      }
    } else {
      try { b.personas = await generatePersonas(name, topic); }
      catch (e) {
        console.warn('persona generation fell back to default pool:', e);
        b.personas = FALLBACK_PERSONAS.default.slice();
      }
      if (!b.personas || b.personas.length === 0) b.personas = FALLBACK_PERSONAS.default.slice();
      b.active = new Set(b.personas.slice(0, ACTIVE_CAP).map(p => p[0]));
      b.lurkers = generateLurkers(rand(5, 14));

      emit(b, { ts: hhmm24(), kind: 'join', nick: state.nick, chan: name });
      emit(b, { ts: hhmm24(), kind: 'topic', chan: name, text: topic });
      emit(b, { ts: hhmm24(), kind: 'topicby', chan: name, who: pick(b.personas)[0],
                when: `${SIM_DATE_STR} 04:12:08 ${SIM_YEAR}` });

      const { rows, count } = buildNamesGrid(b);
      emit(b, { ts: hhmm24(), kind: 'users', chan: name, count, rows });

      emit(b, { ts: hhmm24(), kind: 'mode', chan: name, modes: '+ntr', by: 'ChanServ' });

      // exactly one opening proactive so the channel doesn't immediately
      // flood with three near-identical lines from the just-warm LLM
      const opener = pick(b.personas.slice(0, ACTIVE_CAP));
      enqueue(() => generateProactive(b, opener), [800, 1800]);
    }
  } else {
    emit(b, { ts: hhmm24(), kind: 'join', nick: state.nick, chan: name });
  }

  persistBuffer(b);
  persistAll();
  ls.set('lastChannel', b.name);
  resetIdleTimer();
  scheduleBackgroundEvent();
  renderStatus();
  $inp.focus();
  return b;
}

function partChannel(name, reason) {
  const idx = bufferIndex(name);
  if (idx < 0) { sysToCurrent(`not on ${name}`, 'err'); return; }
  const b = state.buffers[idx];
  emit(b, { ts: hhmm24(), kind: 'part', nick: state.nick, chan: name, reason });
  state.buffers.splice(idx, 1);
  if (state.currentIdx >= state.buffers.length) state.currentIdx = state.buffers.length - 1;
  if (state.currentIdx < 0) {
    state.buffers.push(makeServerBuffer());
    state.currentIdx = 0;
  }
  redrawBuffer();
  persistAll();
}

function switchBuffer(idx) {
  if (idx < 0 || idx >= state.buffers.length) { sysToCurrent(`no buffer ${idx+1}`, 'err'); return; }
  state.currentIdx = idx;
  redrawBuffer();
  resetIdleTimer();
  scheduleBackgroundEvent();
  persistAll();
  const b = currentBuffer();
  if (b && b.type === 'channel') ls.set('lastChannel', b.name);
}

function makeServerBuffer() {
  return { name: currentNet().server, type: 'server', personas: [], active: new Set(), transcript: [], lurkers: [], lastSpoke: new Map() };
}

// =================== commands ===================

const HELP_LINES = [
  '/server [net]            switch network (efnet, ircnet, undernet)',
  '/music on|off|pause      play sinny - sky sunday (XM tracker mod)',
  '/join #chan, /j #chan    join a channel',
  '/part [#chan] [reason]   leave channel',
  '/list                    list channels on the current network',
  '/names                   show user grid for current channel',
  '/who @nick               show persona behind a nick',
  '/whois <nick>, /wi       full /whois for a user',
  '/nick newname            change your nickname',
  '/me action               emote action',
  '/msg #chan text          send to specific channel',
  '/kick <nick> [reason]    try to kick (you are not op, see what happens)',
  '/ban <mask>              try to ban',
  '/kickban <nick>          try to kick+ban',
  '/window N, /win N        switch to buffer N (also Alt+1..9)',
  '/clear                   clear current buffer scrollback',
  '/reset                   wipe all stored state',
  '/help                    this help'
];

async function handleCommand(line) {
  const m = line.match(/^\/(\w+)(?:\s+(.*))?$/);
  if (!m) return false;
  const cmd = m[1].toLowerCase();
  const rest = (m[2] || '').trim();

  switch (cmd) {
    case 'music': {
      const arg = (rest || '').toLowerCase().trim();
      if (arg === 'on' || arg === 'play' || arg === 'start' || arg === '') {
        if (arg === '') {
          sysToCurrent(`music: ${music.status}${music.title ? ' - ' + music.title : ''}. usage: /music on|off|pause`, 'info');
          return true;
        }
        try {
          const info = await music.play();
          const credit = [info.title, info.tracker || 'XM'].filter(Boolean).join(' | ');
          sysToCurrent(`>>> playing: ${credit} (looping)`, 'ok');
        } catch (e) {
          sysToCurrent(`music failed: ${e.message}`, 'err');
        }
        return true;
      }
      if (arg === 'off' || arg === 'stop') {
        music.stop();
        sysToCurrent('>>> music stopped', 'info');
        return true;
      }
      if (arg === 'pause' || arg === 'unpause' || arg === 'toggle') {
        music.togglePause();
        sysToCurrent(`>>> music ${music.status === 'playing' ? 'toggle pause' : 'paused'}`, 'info');
        return true;
      }
      sysToCurrent('usage: /music on|off|pause', 'err');
      return true;
    }
    case 'server': {
      if (!rest) {
        sysToCurrent('Networks:', 'info');
        for (const [k, v] of Object.entries(NETWORKS)) {
          const marker = (k === state.network) ? '* ' : '  ';
          sysToCurrent(`${marker}${k.padEnd(10)} ${v.server.padEnd(20)} ${v.flavour}`, 'info');
        }
        sysToCurrent('switch with: /server <efnet|ircnet|undernet>', 'info');
        return true;
      }
      const target = rest.split(/\s+/)[0].toLowerCase();
      if (!NETWORKS[target]) {
        sysToCurrent(`unknown network ${target}. options: ${Object.keys(NETWORKS).join(', ')}`, 'err');
        return true;
      }
      if (target === state.network) {
        sysToCurrent(`already on ${target}`, 'info');
        return true;
      }
      // persist current state under OLD network namespace first
      persistAll();
      // disable beforeunload-triggered persistAll so the in-memory (old-network)
      // state can't overwrite the new network's storage during reload
      _switchingNetwork = true;
      ls.set('network', target);
      sysToCurrent(`switching to ${target} (${NETWORKS[target].server})...`, 'info');
      setTimeout(() => location.reload(), 400);
      return true;
    }
    case 'join': case 'j': {
      if (!rest) { sysToCurrent('usage: /join #channel', 'err'); return true; }
      await joinChannel(rest.split(/\s+/)[0]);
      return true;
    }
    case 'part': case 'leave': {
      const [chan, ...reasonParts] = rest.split(/\s+/);
      const target = chan || currentBuffer()?.name;
      const reason = reasonParts.join(' ') || 'leaving';
      if (target && target.startsWith('#')) partChannel(target, reason);
      else sysToCurrent('not on a channel', 'err');
      return true;
    }
    case 'list': {
      const net = currentNet();
      sysToCurrent(`Channels on ${net.name} (${net.server})`, 'info');
      for (const [n, t] of Object.entries(net.channels)) {
        sysToCurrent(`  ${n.padEnd(14)} ${t}`, 'info');
      }
      return true;
    }
    case 'names': case 'n': {
      const b = currentBuffer();
      if (!b || b.type !== 'channel') { sysToCurrent('not on a channel', 'err'); return true; }
      const { rows, count } = buildNamesGrid(b);
      emit(b, { ts: hhmm24(), kind: 'users', chan: b.name, count, rows });
      return true;
    }
    case 'who': {
      const target = rest.replace(/^@/, '').toLowerCase();
      const b = currentBuffer();
      if (!b || b.type !== 'channel') { sysToCurrent('not on a channel', 'err'); return true; }
      const p = personaFor(b, target);
      if (!p) sysToCurrent(`no such persona ${target}`, 'err');
      else sysToCurrent(`@${p[0]}: ${p[1]}`, 'info');
      return true;
    }
    case 'whois': case 'wi': {
      const target = (rest.replace(/^@/, '').split(/\s+/)[0] || '').toLowerCase();
      if (!target) { sysToCurrent('usage: /whois <nick>', 'err'); return true; }
      const b = currentBuffer();
      const isChan = b && b.type === 'channel';
      const p = isChan ? personaFor(b, target) : null;
      const isMe = state.nick && target === state.nick.toLowerCase();
      const isLurker = isChan && (b.lurkers || []).some(n => n.toLowerCase() === target);
      if (!p && !isMe && !isLurker) {
        sysToCurrent(`${target} :No such nick/channel`, 'err');
        return true;
      }
      const hostmask = fakeHost(target);
      const realName = isMe ? (state.nick + ', operator of the carbon-based unit')
        : p ? p[1].split(/[,.]/, 1)[0].slice(0, 80)
        : pick(WHOIS_FAKE_REALNAMES);
      const otherChans = whoisChannels(target, isChan ? b.name : null, isMe);
      const idle = whoisIdle();
      const signon = whoisSignon();
      sysToCurrent(`${target} is ${hostmask} * ${realName}`, 'info');
      sysToCurrent(`${target} on ${otherChans}`, 'info');
      sysToCurrent(`${target} using ${currentNet().server} ${currentNet().name}`, 'info');
      sysToCurrent(`${target} has been idle ${idle}, signon at ${signon}`, 'info');
      if (isMe) sysToCurrent(`${target} is using modes +iw`, 'info');
      else if (p) sysToCurrent(`${target} ${pick(WHOIS_EXTRAS)}`, 'info');
      sysToCurrent(`${target} :End of /WHOIS list.`, 'info');
      return true;
    }
    case 'kick': case 'k': {
      const b = currentBuffer();
      if (!b || b.type !== 'channel') { sysToCurrent('not on a channel', 'err'); return true; }
      if (!rest) { sysToCurrent('usage: /kick <nick> [reason]', 'err'); return true; }
      // user is not op in seeded channels - faithful EFnet refusal
      sysToCurrent(`${b.name} :You're not channel operator`, 'err');
      return true;
    }
    case 'ban': case 'b': {
      const b = currentBuffer();
      if (!b || b.type !== 'channel') { sysToCurrent('not on a channel', 'err'); return true; }
      if (!rest) { sysToCurrent('usage: /ban <nick|hostmask>', 'err'); return true; }
      sysToCurrent(`${b.name} :You're not channel operator`, 'err');
      return true;
    }
    case 'kickban': case 'kb': {
      const b = currentBuffer();
      if (!b || b.type !== 'channel') { sysToCurrent('not on a channel', 'err'); return true; }
      if (!rest) { sysToCurrent('usage: /kickban <nick> [reason]', 'err'); return true; }
      sysToCurrent(`${b.name} :You're not channel operator`, 'err');
      return true;
    }
    case 'nick': {
      if (!rest) { sysToCurrent('usage: /nick newname', 'err'); return true; }
      const old = state.nick;
      state.nick = rest.split(/\s+/)[0];
      for (const b of state.buffers) {
        if (b.type === 'channel') emit(b, { ts: hhmm24(), kind: 'nick', oldNick: old, newNick: state.nick });
      }
      persistAll();
      renderStatus();
      return true;
    }
    case 'me': {
      const b = currentBuffer();
      if (!b || b.type !== 'channel') { sysToCurrent('not on a channel', 'err'); return true; }
      if (!rest) return true;
      emit(b, { ts: hhmm24(), kind: 'me', nick: state.nick, text: rest });
      onUserMessage(b, `* ${state.nick} ${rest}`);
      return true;
    }
    case 'msg': {
      const sp = rest.indexOf(' ');
      if (sp < 0) { sysToCurrent('usage: /msg #chan text', 'err'); return true; }
      const target = rest.slice(0, sp);
      const text = rest.slice(sp + 1);
      const tb = bufferByName(target);
      if (!tb) { sysToCurrent(`not on ${target}`, 'err'); return true; }
      emit(tb, { ts: hhmm24(), kind: 'msg', nick: state.nick, text });
      onUserMessage(tb, text);
      return true;
    }
    case 'window': case 'win': case 'w': {
      const n = parseInt(rest, 10);
      if (!Number.isFinite(n)) { sysToCurrent('usage: /window N', 'err'); return true; }
      switchBuffer(n - 1);
      return true;
    }
    case 'clear': {
      const b = currentBuffer();
      if (b) { b.transcript = []; persistBuffer(b); redrawBuffer(); }
      return true;
    }
    case 'reset': {
      if (!confirm('clear all stored channels, personas, transcripts?')) return true;
      for (const k of Object.keys(localStorage)) if (k.startsWith('bx2:')) localStorage.removeItem(k);
      location.reload();
      return true;
    }
    case 'help': case 'h': case '?': {
      sysToCurrent('Commands', 'info');
      for (const l of HELP_LINES) sysToCurrent('  ' + l, 'info');
      return true;
    }
    case 'quit': {
      sysToCurrent('quit not implemented (close the tab)', 'err');
      return true;
    }
    default:
      sysToCurrent(`unknown command: /${cmd}`, 'err');
      return true;
  }
}

// =================== input ===================

$inp.addEventListener('keydown', async (e) => {
  if (e.key !== 'Enter') return;
  const line = $inp.value;
  if (!line) return;
  $inp.value = '';
  if (line.startsWith('/')) {
    try { await handleCommand(line); }
    catch (err) { console.error(err); sysToCurrent(`command error: ${err.message || err}`, 'err'); }
    return;
  }
  const b = currentBuffer();
  if (!b || b.type !== 'channel') {
    sysToCurrent('not on a channel. try /join #2600', 'err');
    return;
  }
  emit(b, { ts: hhmm24(), kind: 'msg', nick: state.nick, text: line });
  onUserMessage(b, line);
});

window.addEventListener('keydown', (e) => {
  if (!e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
  const n = parseInt(e.key, 10);
  if (Number.isFinite(n) && n >= 1 && n <= 9) {
    e.preventDefault();
    switchBuffer(n - 1);
  }
});
